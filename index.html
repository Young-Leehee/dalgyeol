<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="달결">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#FBF7F4">
<title>달결</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#FBF7F4;--card:#fff;--ink:#3A2E39;--muted:#9A8C98;--line:#F1EBEE;
  --gyeol:#6B84A3;
  --period:#F2A0B8;--period-l:#F8CBD8;--period-t:#FCE8EE;
  --pill:#7CC4B8;--pill-l:#BFE5DD;--pill-d:#3F8F83;--pill-t:#E3F4F0;
  --lav:#DDD2F7;--violet:#9E86DE;
  --gray:#DAD3D7;--gray-t:#F3F0F1;
  --heart:#EC7F9E;--heart-t:#FDE8EF;
  --spot:#B8927E;--spot-t:#F1EAE5;
  --sun:#D9849E;--sat:#7F9CD6;
  --sel:#FDF9EF;
  --cellH:92px;
  --floatB:28px;   /* 팝업이 화면 바닥에서 떨어진 거리 */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg);overscroll-behavior:none}
html.lock,html.lock body{overflow:hidden}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--ink);max-width:480px;margin:0 auto;
  padding:18px 14px 16px;overscroll-behavior:none}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-size:23px;font-weight:800;letter-spacing:-.5px}.logo span{color:var(--gyeol)}
.logo small{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px;letter-spacing:0}
.icon-btn{border:0;background:var(--card);width:44.6px;height:44.6px;border-radius:14px;display:grid;place-items:center;
  color:var(--ink);box-shadow:0 2px 8px rgba(58,46,57,.07);cursor:pointer}
.icon-btn svg{width:24.7px;height:24.7px}
.cal{background:var(--card);border-radius:20px;padding:14px 6px 8px;box-shadow:0 4px 18px rgba(58,46,57,.06);
  overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 12px}
.title-btn{border:0;background:none;font-size:19px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;padding:4px 2px}
.title-btn span{font-size:12px;color:var(--muted);margin-left:2px}
.today-btn{border:0;background:var(--bg);border-radius:10px;height:34px;padding:0 14px;
  font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.week div{text-align:center;font-size:12px;color:var(--muted);padding-bottom:6px;font-weight:700}
.week div:first-child{color:var(--sun)}.week div:last-child{color:var(--sat)}
.cell{position:relative;height:var(--cellH);cursor:pointer;border-top:1px solid var(--line);transition:background .15s}
.cell.out{opacity:.35}
.cell.sel{background:var(--sel)}
.num{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:26px;height:26px;line-height:26px;
  text-align:center;border-radius:50%;font-size:14px;font-weight:600}
.cell.sun .num{color:var(--sun)}.cell.sat .num{color:var(--sat)}
.cell.today .num{background:var(--ink);color:#fff!important}
.ic{position:absolute;top:33px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:2px;line-height:1}
.ic svg{width:12.1px;height:12.1px}
.mm{position:absolute;top:47px;left:2px;right:2px;font-size:9px;line-height:11px;color:#7d6e7b;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:absolute;left:0;right:0;height:12px;font-size:9px;line-height:12px;font-weight:700;letter-spacing:-.3px;
  white-space:nowrap;padding-left:4px;z-index:1}
.bar.s{left:4px;border-top-left-radius:6px;border-bottom-left-radius:6px}
.bar.e{right:4px;border-top-right-radius:6px;border-bottom-right-radius:6px}
.b-period{bottom:28px;background:var(--period);color:#8A3D55}
.b-pred{bottom:28px;background:#FBE3EA;color:#C0728A}
.b-fert{bottom:15px;background:var(--lav);color:#5D4B98}
.b-brk{bottom:2px;background:var(--gray);color:#6E656A}
.anim-l{animation:inL .25s ease}.anim-r{animation:inR .25s ease}
@keyframes inL{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
#spacer{height:0}
.grab{width:36px;height:4px;border-radius:2px;background:#E3DCE0;margin:0 auto 10px}
/* 날짜 팝업 (떠 있는 카드) */
.day{position:fixed;left:50%;bottom:var(--floatB);transform:translate(-50%,calc(100% + 60px));
  width:calc(100% - 24px);max-width:456px;max-height:50vh;overflow:auto;
  background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(58,46,57,.16);
  padding:10px 18px 18px;z-index:9;transition:transform .25s}
.day.on{transform:translate(-50%,0)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.dl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.dt{font-size:17px;font-weight:800;margin-right:2px}
.chip{background:var(--gray-t);border-radius:8px;padding:3px 7px;font-size:11.5px;font-weight:600;color:#6b5a68;white-space:nowrap}
.fab{width:42.3px;height:42.3px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;
  box-shadow:0 3px 10px rgba(58,46,57,.2);cursor:pointer;flex:none}
.fab svg{width:20px;height:20px}
.ck{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.ck .box{width:24px;height:24px;border-radius:7px;border:2px solid #E6DCE1;display:grid;place-items:center;
  color:#fff;font-size:13px;font-weight:800;flex:none;transition:.15s}
.ck.on .box{background:var(--c);border-color:var(--c)}
.ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.ico svg{width:16px;height:16px}
.ck .lb{flex:1;font-size:15px;font-weight:700}
.ck .lb small{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.ck.sub{padding-left:38px;background:#FDFBFC}
.ck.sub .lb{font-size:14px}
.links{display:flex;gap:16px;padding:2px 0 8px 38px;border-bottom:1px solid var(--line)}
.lnk{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:2px 0}
.list>:last-child{border-bottom:0}
.memo-view{display:flex;gap:10px;align-items:center;padding:10px 2px;cursor:pointer;border-top:1px solid var(--line)}
.memo-view .mv{flex:1;font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
/* 설정·메모·월 선택 창 (떠 있는 카드) */
.dim{position:fixed;inset:0;background:rgba(40,30,40,.3);display:none;z-index:10;cursor:pointer}
.dim.on{display:block}
.sheet{position:fixed;left:50%;bottom:var(--floatB);transform:translate(-50%,calc(100% + 60px));
  width:calc(100% - 24px);max-width:456px;max-height:68vh;
  overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#fff;border-radius:22px;
  box-shadow:0 8px 30px rgba(58,46,57,.16);padding:10px 20px 22px;z-index:11;transition:transform .25s}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{font-size:18px;margin-bottom:10px}
.sec{margin:14px 0}
.t{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.b{border:1px solid #EADFE4;background:#fff;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;
  cursor:pointer;color:var(--ink);font-family:inherit}
.b.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.b.full{width:100%;padding:12px}
textarea,select,input[type=number],input[type=time]{border:1px solid #EADFE4;border-radius:12px;padding:10px;font:inherit;font-size:16px;color:var(--ink);background:#fff;-webkit-appearance:none;appearance:none}
textarea{width:100%;min-height:64px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:14px}
.row input[type=number]{width:90px}.row input[type=time]{width:130px;text-align:center}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--pill);flex:none}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.ypick{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 14px}
.ypick select{flex:1;text-align:center;font-size:17px;font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mgrid .b{padding:14px 0}
/* 로그인 화면 */
.auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.auth.hide{display:none}
.auth-box{width:100%;max-width:340px;text-align:center}
.auth-box .logo{font-size:34px;margin-bottom:8px}
.auth-box input{width:100%;border:1px solid #EADFE4;border-radius:12px;padding:13px;font:inherit;font-size:16px;
  margin-top:10px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
.auth-main{width:100%;margin-top:14px;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;
  background:var(--ink);color:#fff;font-family:inherit;cursor:pointer}
.auth-sub{width:100%;margin-top:8px;border:1px solid #EADFE4;border-radius:14px;padding:13px;font-size:15px;font-weight:600;
  background:#fff;color:var(--ink);font-family:inherit;cursor:pointer}
.auth-main:disabled,.auth-sub:disabled{opacity:.5}
.auth-err{color:var(--heart);font-size:13px;min-height:18px;margin-top:12px;line-height:1.5}
</style>
</head>
<body>

<div class="auth" id="auth">
  <div class="auth-box">
    <div class="logo">달<span>결</span></div>
    <p class="note" id="authLoading">불러오는 중…</p>
    <div id="authForm" style="display:none">
      <p class="note">기록을 계정에 안전하게 보관해요.<br>앱을 지우거나 기기를 바꿔도 로그인하면 그대로예요.</p>
      <input type="email" id="aEmail" placeholder="이메일" autocomplete="username" autocapitalize="off">
      <input type="password" id="aPw" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
      <button class="auth-main" id="btnLogin">로그인</button>
      <button class="auth-sub" id="btnSignup">처음이에요 · 계정 만들기</button>
      <button class="lnk" id="btnReset" style="margin-top:10px">비밀번호를 잊었어요</button>
      <p class="auth-err" id="authErr"></p>
    </div>
  </div>
</div>

<header>
  <div class="logo">달<span>결</span><small>나의 주기 기록</small></div>
  <button class="icon-btn" id="btnSet" aria-label="설정">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<section class="cal" id="cal">
  <div class="cal-head">
    <button class="title-btn" id="title"></button>
    <button class="today-btn" id="today">오늘</button>
  </div>
  <div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
  <div class="grid" id="grid"></div>
</section>
<div id="spacer"></div>

<div class="day" id="day"></div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
const KEY='dalgyeol-v1',OLD_KEY='lunanote-v1';
const $=s=>document.querySelector(s);
const WD=['일','월','화','수','목','금','토'];

/* ---------- 아이콘 (SVG) ---------- */
const ICON={
  period:`<svg viewBox="0 0 24 24"><path d="M12 3.5C9.2 7.6 6.5 10.7 6.5 14.2a5.5 5.5 0 0 0 11 0c0-3.5-2.7-6.6-5.5-10.7z" fill="var(--period)"/></svg>`,
  pill:(c1='var(--pill)',c2='var(--pill-l)')=>`<svg viewBox="0 0 24 24"><g transform="rotate(-45 12 12)">
    <rect x="3.5" y="8.5" width="17" height="7" rx="3.5" fill="${c2}"/>
    <path d="M12 8.5H7a3.5 3.5 0 0 0 0 7h5z" fill="${c1}"/></g></svg>`,
  heart:(fill)=>`<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"
    fill="${fill?'var(--heart)':'#fff'}" stroke="var(--heart)" stroke-width="2.2" stroke-linejoin="round"/></svg>`,
  spot:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5" fill="var(--spot)"/></svg>`,
  note:`<svg viewBox="0 0 24 24" fill="none" stroke="#9A8C98" stroke-width="2" stroke-linecap="round"><path d="M6 7h12M6 12h12M6 17h8"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  pencil:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>`
};

/* ---------- 날짜 유틸 ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/86400000);
const fmt=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}`};
const fmtLong=s=>{const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byStart=(a,b)=>a.start<b.start?-1:a.start>b.start?1:0;
let TODAY=ymd(new Date());

/* ---------- 저장 ---------- */
function def(){return{periods:[],logs:{},pill:{starts:[],stops:[],taken:{}},
  settings:{cycle:28,plen:5,showOvuOnPill:false,askProt:true,pillTime:''},updatedAt:0}}
function migrate(v){
  if(v&&v.pill&&!v.pill.starts){
    const o=v.pill;
    v.pill={starts:o.start?[o.start]:[],stops:o.end?[addDays(o.end,1)]:[],taken:o.taken||{}};
  }
  return v;
}
function normalize(v){
  const d=def();v=migrate(v);
  return{...d,...v,pill:{...d.pill,...v.pill},settings:{...d.settings,...v.settings}};
}
function load(){
  try{
    let v=JSON.parse(localStorage.getItem(KEY));
    if(!v)v=JSON.parse(localStorage.getItem(OLD_KEY)||'null');
    if(v)return normalize(v);
  }catch(e){}
  return def();
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.updatedAt=Date.now();persist();if(window.cloudPush)window.cloudPush()}
let S=load();persist();
let view=new Date();view.setDate(1);
let sel=null,sheetMode=null,pickY=view.getFullYear(),curRows=6;

window.dg={
  get:()=>S,
  set:v=>{S=normalize(v);persist();if(sel)openDay(sel);else render()},
  reset:()=>{S=def();try{localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY)}catch(e){}hideDay();render()}
};

/* ---------- 계산 ---------- */
function stats(){
  const ps=[...S.periods].sort(byStart);
  const gaps=[];
  for(let i=1;i<ps.length;i++){const g=diff(ps[i].start,ps[i-1].start);if(g>=15&&g<=60)gaps.push(g)}
  const g6=gaps.slice(-6);
  const cycle=g6.length?Math.round(g6.reduce((a,b)=>a+b,0)/g6.length):+S.settings.cycle;
  const lens=ps.map(p=>diff(p.end,p.start)+1).filter(n=>n>=2).slice(-6);
  const plen=lens.length?Math.round(lens.reduce((a,b)=>a+b,0)/lens.length):+S.settings.plen;
  return{ps,cycle,plen,last:ps[ps.length-1]};
}
function pillInfo(d){
  const st=S.pill.starts.filter(x=>x<=d).sort();
  if(!st.length)return null;
  const s=st[st.length-1];
  if(S.pill.stops.some(x=>x>s&&x<=d))return null;
  const i=diff(d,s);
  if(i<21)return{type:'on',n:i+1,start:s};
  if(i<28&&S.pill.taken[addDays(s,20)])return{type:'brk',n:i-20,start:s};
  return null;
}
const hidePred=d=>!!pillInfo(d)&&!S.settings.showOvuOnPill;
const heartFilled=lg=>!S.settings.askProt||!!lg.prot;

function buildMarks(){
  const m={},st=stats();
  const put=(d,k,v)=>{(m[d]||(m[d]={}))[k]=v};
  const range=(s,e,k,label='')=>{for(let d=s;d<=e;d=addDays(d,1))put(d,k,{s:d===s,e:d===e,label:d===s?label:''})};
  const ovu=ov=>{
    if(hidePred(ov))return;
    range(addDays(ov,-5),addDays(ov,1),'fert','가임기');
    m[ov].fert.label='배란';put(ov,'ovu',true);
  };
  st.ps.forEach((p,i)=>{range(p.start,p.end,'period','생리');if(i>0)ovu(addDays(p.start,-14))});
  const L=st.last;
  if(L){
    const ee=addDays(L.start,st.plen-1);
    if(L.end<ee&&ee>=TODAY&&diff(TODAY,L.end)<=1)range(addDays(L.end,1),ee,'pred','');
    for(let i=1;i<=13;i++){
      const P=addDays(L.start,st.cycle*i);
      if(!hidePred(P))range(P,addDays(P,st.plen-1),'pred','예정');
      ovu(addDays(P,-14));
    }
  }
  return m;
}

/* ---------- 생리 시작·종료 ---------- */
function periodCtx(d){
  const ps=[...S.periods].sort(byStart);
  const inP=ps.find(p=>d>=p.start&&d<=p.end);
  const recent=inP?null:[...ps].reverse().find(p=>p.end<d&&diff(d,p.start)<=10);
  const next=(inP||recent)?null:ps.find(p=>p.start>d&&diff(p.start,d)<=3);
  return{inP,recent,next};
}
function mergePeriods(){
  const sorted=S.periods.sort(byStart),out=[];
  sorted.forEach(p=>{
    const l=out[out.length-1];
    if(l&&p.start<=addDays(l.end,1)){if(p.end>l.end)l.end=p.end}
    else out.push({...p});
  });
  S.periods=out;
}
function togglePeriod(d){
  const {inP,recent,next}=periodCtx(d);
  if(inP){
    if(inP.start===inP.end)S.periods=S.periods.filter(p=>p!==inP);
    else if(d===inP.start)inP.start=addDays(d,1);
    else inP.end=addDays(d,-1);
    return;
  }
  if(recent)recent.end=d;           // 종료일: 시작일부터 이 날까지 채움
  else if(next)next.start=d;        // 시작일 앞당기기
  else S.periods.push({start:d,end:d}); // 새 시작
  mergePeriods();
}

/* ---------- 캘린더 크기: 화면 높이에 맞춤 ---------- */
function fitCells(){
  const g=$('#grid');
  const top=g.getBoundingClientRect().top+window.scrollY;
  const h=Math.floor((window.innerHeight-top-28)/curRows);
  document.documentElement.style.setProperty('--cellH',Math.max(92,Math.min(h,150))+'px');
}
// 날짜를 누르지 않은 상태에서는 위아래 스크롤 잠금
function updateLock(){document.documentElement.classList.toggle('lock',!sel)}

/* ---------- 렌더 ---------- */
function render(dir){
  const y=view.getFullYear(),mo=view.getMonth();
  $('#title').innerHTML=`${y}년 ${mo+1}월<span>▾</span>`;
  const marks=buildMarks();
  const first=new Date(y,mo,1);
  const days=new Date(y,mo+1,0).getDate();
  const rows=Math.ceil((first.getDay()+days)/7);
  curRows=rows;
  const bar=(k,o)=>`<span class="bar b-${k}${o.s?' s':''}${o.e?' e':''}">${o.label||''}</span>`;
  let h='';
  for(let i=0;i<rows*7;i++){
    const dt=new Date(y,mo,1-first.getDay()+i);
    const d=ymd(dt),mk=marks[d]||{},lg=S.logs[d]||{},pi=pillInfo(d);
    let cls='cell';
    if(dt.getMonth()!==mo)cls+=' out';
    if(i%7===0)cls+=' sun';if(i%7===6)cls+=' sat';
    if(d===TODAY)cls+=' today';if(d===sel)cls+=' sel';
    let x=`<span class="num">${dt.getDate()}</span>`;
    if(mk.period)x+=bar('period',mk.period);else if(mk.pred)x+=bar('pred',mk.pred);
    if(mk.fert)x+=bar('fert',mk.fert);
    if(pi&&pi.type==='brk'){
      const nx=addDays(d,1);
      x+=bar('brk',{s:pi.n===1,e:pi.n===7||S.pill.starts.includes(nx),label:pi.n===1?'휴약':''});
    }
    let ic='';
    if(S.pill.taken[d])ic+=ICON.pill();
    if(lg.sex)ic+=ICON.heart(heartFilled(lg));
    if(lg.spot)ic+=ICON.spot;
    if(ic)x+=`<div class="ic">${ic}</div>`;
    if(lg.memo)x+=`<div class="mm">${esc(lg.memo.split('\n')[0])}</div>`;
    h+=`<div class="${cls}" data-d="${d}">${x}</div>`;
  }
  const g=$('#grid');g.innerHTML=h;
  fitCells();updateLock();
  if(dir){g.classList.remove('anim-l','anim-r');void g.offsetWidth;g.classList.add('anim-'+dir)}
}

/* ---------- 날짜 팝업 ---------- */
const ck=({on,c,a,icon,tint,label,small,cls=''})=>
  `<div class="ck ${on?'on':''} ${cls}" style="--c:${c}" data-a="${a}">
    <span class="ico" style="background:${tint}">${icon}</span>
    <span class="lb">${label}${small?`<small>${small}</small>`:''}</span>
    <span class="box">${on?'✓':''}</span></div>`;

function dayChips(d){
  const st=stats(),mk=buildMarks()[d]||{},pi=pillInfo(d),chips=[];
  const inP=S.periods.find(p=>d>=p.start&&d<=p.end);
  if(!inP){
    const cand=S.periods.map(p=>p.start).filter(s=>s>d);
    if(st.last)for(let i=1;i<=13;i++){const P=addDays(st.last.start,st.cycle*i);if(P>d&&!hidePred(P))cand.push(P)}
    cand.sort();
    if(cand.length&&diff(cand[0],d)<=45)chips.push(`생리 ${diff(cand[0],d)}일 전`);
  }
  if(mk.ovu)chips.push('배란 예정일');else if(mk.fert)chips.push('가임기');
  if(pi)chips.push(pi.type==='on'?`피임약 ${pi.n}일차`:`휴약 ${pi.n}/7일차`);
  return chips;
}

function openDay(d){
  sel=d;render();
  const lg=S.logs[d]||{},pi=pillInfo(d);
  const {inP,recent,next}=periodCtx(d);
  const taken=!!S.pill.taken[d];
  let h=`<div class="grab"></div>
    <div class="dh"><div class="dl"><span class="dt">${fmtLong(d)}</span>
    ${dayChips(d).map(c=>`<span class="chip">${c}</span>`).join('')}</div>
    <button class="fab" data-a="memo" aria-label="메모">${lg.memo?ICON.pencil:ICON.plus}</button></div><div class="list">`;

  // 생리: 상황에 따라 시작 / 종료 / n일차
  if(inP){
    h+=ck({on:true,c:'var(--period)',a:'period',icon:ICON.period,tint:'var(--period-t)',
      label:`생리 ${diff(d,inP.start)+1}일차`,small:`${fmt(inP.start)}~${fmt(inP.end)}`});
    h+=`<div class="links">${d!==inP.end?'<button class="lnk" data-a="pend">이 날로 종료</button>':''}<button class="lnk" data-a="pdel">이 기간 삭제</button></div>`;
  }else if(recent){
    h+=ck({on:false,c:'var(--period)',a:'period',icon:ICON.period,tint:'var(--period-t)',
      label:'생리 종료',small:`${fmt(recent.start)}부터 이 날까지 채우기`});
  }else if(next){
    h+=ck({on:false,c:'var(--period)',a:'period',icon:ICON.period,tint:'var(--period-t)',
      label:'생리 시작',small:`${fmt(next.start)} 시작을 이 날로 앞당기기`});
  }else{
    h+=ck({on:false,c:'var(--period)',a:'period',icon:ICON.period,tint:'var(--period-t)',label:'생리 시작'});
  }

  let pillSmall='';
  if(pi&&pi.type==='on')pillSmall=`${pi.n}일차`;
  else if(pi&&pi.type==='brk')pillSmall=`휴약 ${pi.n}/7`;
  h+=ck({on:taken,c:'var(--pill)',a:'pill',icon:ICON.pill(),tint:'var(--pill-t)',label:'피임약',small:pillSmall});
  if(pi&&pi.type==='on'&&pi.start!==d)h+=`<div class="links"><button class="lnk" data-a="start">이 날을 새 팩 1일차로</button></div>`;

  h+=ck({on:!!lg.sex,c:'var(--heart)',a:'tg|sex',icon:ICON.heart(lg.sex?heartFilled(lg):true),tint:'var(--heart-t)',label:'성관계'});
  if(lg.sex&&S.settings.askProt){
    h+=ck({on:!!lg.prot,c:'var(--heart)',a:'tg|prot',icon:ICON.heart(!!lg.prot),tint:'var(--heart-t)',label:'피임도구 사용',cls:'sub'});
  }
  h+=ck({on:!!lg.spot,c:'var(--spot)',a:'tg|spot',icon:ICON.spot,tint:'var(--spot-t)',label:'부정출혈'});

  if(lg.memo)h+=`<div class="memo-view" data-a="memo"><span class="ico" style="background:var(--gray-t)">${ICON.note}</span><span class="mv">${esc(lg.memo)}</span></div>`;
  h+=`</div>`;

  const box=$('#day');box.innerHTML=h;box.classList.add('on');
  const fb=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--floatB'))||28;
  const ph=box.offsetHeight+fb;
  $('#spacer').style.height=ph+'px';
  const cell=document.querySelector(`.cell[data-d="${d}"]`);
  if(cell){
    const r=cell.getBoundingClientRect(),limit=window.innerHeight-ph-8;
    if(r.bottom>limit)window.scrollBy({top:r.bottom-limit,behavior:'smooth'});
    else if(r.top<0)window.scrollBy({top:r.top-8,behavior:'smooth'});
  }
}

/* ---------- 동작 ---------- */
function setLog(d,k,v){
  const l=S.logs[d]||(S.logs[d]={});
  if(v===false||v===''||v==null||(Array.isArray(v)&&!v.length))delete l[k];else l[k]=v;
  if(!Object.keys(l).length)delete S.logs[d];
  save();
}
const uniqPush=(arr,v)=>{if(!arr.includes(v))arr.push(v)};
function act(a,v){
  const d=sel,P=S.pill;
  switch(a){
    case 'close':return closeSheet();
    case 'memo':return openMemo();
    case 'memosave':{const t=$('#memo');setLog(sel,'memo',t&&t.value.trim()?t.value:'');return closeSheet();}
    case 'py':pickY+=+v;return drawPicker();
    case 'pm':{
      const n=new Date();
      view=v==='now'?new Date(n.getFullYear(),n.getMonth(),1):new Date(pickY,+v,1);
      hideDay();return closeSheet();}
    case 'period':togglePeriod(d);break;
    case 'pend':{const p=S.periods.find(p=>d>=p.start&&d<=p.end);if(p)p.end=d;break;}
    case 'pdel':
      if(!confirm('이 생리 기간을 삭제할까요?'))return;
      S.periods=S.periods.filter(p=>!(d>=p.start&&d<=p.end));break;
    case 'pill':{
      const pi=pillInfo(d);
      if(pi&&pi.type==='on'){
        if(P.taken[d]){
          if(d===pi.start){
            const others=Object.keys(P.taken).some(x=>x>d&&x<addDays(d,21));
            if(others&&!confirm('1일차를 해제하면 이 팩의 일차 계산이 사라져요. 해제할까요?'))return;
            P.starts=P.starts.filter(x=>x!==d);
          }
          delete P.taken[d];
        }else P.taken[d]=true;
      }else{uniqPush(P.starts,d);P.stops=P.stops.filter(x=>x!==d);P.taken[d]=true}
      break;}
    case 'start':uniqPush(P.starts,d);P.stops=P.stops.filter(x=>x!==d);P.taken[d]=true;break;
    case 'tg':{
      const cur=!(S.logs[d]||{})[v];setLog(d,v,cur);
      if(v==='sex'&&!cur)setLog(d,'prot',false);break;}
    case 'csv':return saveFile(`dalgyeol_${TODAY}.csv`,toCSV(),'text/csv');
    case 'json':return saveFile(`dalgyeol_backup_${TODAY}.json`,JSON.stringify(S,null,2),'application/json');
    case 'imp':return $('#file').click();
    case 'logout':
      if(confirm('로그아웃할까요?\n기록은 계정에 안전하게 남아 있어요.')){$('#sheet').classList.remove('on');$('#dim').classList.remove('on');sheetMode=null;hideDay();render();if(window.cloudLogout)window.cloudLogout()}
      return;
    case 'reset':
      if(confirm('모든 기록을 삭제할까요? 계정에 저장된 기록도 함께 지워지고 되돌릴 수 없어요.')&&confirm('정말 삭제할까요?')){S=def();save();hideDay();closeSheet()}
      return;
  }
  save();if(sel)openDay(sel);else render();
}

/* ---------- 내보내기 ---------- */
function toCSV(){
  const dates=new Set([...Object.keys(S.logs),...Object.keys(S.pill.taken),...S.pill.starts]);
  S.periods.forEach(p=>{for(let d=p.start;d<=p.end;d=addDays(d,1))dates.add(d)});
  const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const rows=[['날짜','요일','생리','피임약','복용 체크','성관계','피임도구','부정출혈','메모']];
  [...dates].sort().forEach(d=>{
    const l=S.logs[d]||{},p=S.periods.find(p=>d>=p.start&&d<=p.end),pi=pillInfo(d);
    const pillTxt=pi?(pi.type==='on'?`${pi.n}일차`:`휴약 ${pi.n}일차`):'';
    rows.push([d,WD[parse(d).getDay()],p?`${diff(d,p.start)+1}일차`:'',pillTxt,S.pill.taken[d]?'O':'',
      l.sex?'O':'',l.sex?(l.prot?'O':'X'):'',l.spot?'O':'',l.memo||'']);
  });
  rows.push([],['[생리 기간 목록]'],['시작일','종료일','기간(일)','이전 시작일과 간격(일)']);
  const ps=stats().ps;
  ps.forEach((p,i)=>rows.push([p.start,p.end,diff(p.end,p.start)+1,i?diff(p.start,ps[i-1].start):'']));
  return '\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n');
}
async function saveFile(name,text,type){
  try{
    const file=new File([text],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});
      return;
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

/* ---------- 아래로 끌어서 닫기 ---------- */
function swipeClose(el,onClose){
  let y0=null,dy=0;
  el.addEventListener('touchstart',e=>{
    if(el.scrollTop>0||e.target.closest('textarea,input,select')){y0=null;return}
    y0=e.touches[0].clientY;dy=0;
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(y0==null)return;
    dy=e.touches[0].clientY-y0;
    if(dy>0){el.style.transition='none';el.style.transform=`translate(-50%,${dy}px)`}
  },{passive:true});
  el.addEventListener('touchend',()=>{
    if(y0==null)return;
    el.style.transition='';el.style.transform='';
    if(dy>70)onClose();
    y0=null;dy=0;
  });
}
swipeClose($('#day'),closeDay);
swipeClose($('#sheet'),()=>closeSheet());

$('#dim').onclick=closeSheet;

let pd=null;

document.addEventListener('pointerup',e=>{

  else if(t.id==='s-ovu')S.settings.showOvuOnPill=t.checked;

$('#file').onchange=e=>{

    const v=JSON.parse(r.result);
    if(!v.periods||!v.logs)throw 0;
    if(confirm('현재 기록을 백업 파일 내용으로 바꿀까요?')){S=normalize(v);save();closeSheet()}
  }catch(err){alert('올바른 달결 백업 파일이 아니에요.')}};

const cal=$('#cal');let tx=null,ty=0,lastWheel=0;
cal.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
cal.addEventListener('touchend',e=>{
  if(tx==null)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)move(dx<0?1:-1);
  tx=null;
},{passive:true});
cal.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>25&&Date.now()-lastWheel>450){
    lastWheel=Date.now();move(e.deltaX>0?1:-1);
  }
},{passive:true});
document.addEventListener('keydown',e=>{
  if(sheetMode||!$('#auth').classList.contains('hide'))return;
  if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);
  if(e.key==='Escape'&&sel)closeDay();
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){const t=ymd(new Date());if(t!==TODAY){TODAY=t;render()}else fitCells()}
});
window.addEventListener('resize',fitCells);
window.addEventListener('orientationchange',()=>setTimeout(fitCells,300));
if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
setTimeout(()=>{
  if(!window.cloudReady&&!$('#auth').classList.contains('hide')){
    $('#authLoading').innerHTML='연결이 원활하지 않아요.<br><button class="lnk" onclick="document.getElementById(\'auth\').classList.add(\'hide\')">이 기기 기록으로 계속하기</button>';
  }
},10000);

render();
</script>

<!-- ===== 클라우드 저장 (Firebase) ===== -->
<script type="module">
// ▼ Firebase 값을 여기에 붙여넣으세요 (설정 6단계에서 복사한 내용)
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
// ▲ 여기까지

const q=s=>document.querySelector(s);
const setSync=t=>{window.syncText=t};
const nowT=()=>{const d=new Date();return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};
const hideAuth=()=>q('#auth').classList.add('hide');

if(!firebaseConfig.apiKey){
  window.cloudReady=true;hideAuth();
}else{
  try{
    const V='10.12.2';
    const {initializeApp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const A=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const F=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app=initializeApp(firebaseConfig);
    const auth=A.getAuth(app);auth.languageCode='ko';
    const db=F.getFirestore(app);

    let ref=null,unsub=null,timer=null;
    const push=()=>{
      if(!ref)return;
      clearTimeout(timer);setSync('저장 중…');
      timer=setTimeout(async()=>{
        const s=dg.get();
        try{await F.setDoc(ref,{data:JSON.stringify(s),updatedAt:s.updatedAt||0});setSync(`계정에 저장됨 · ${nowT()}`)}
        catch(e){setSync('저장 실패 · 연결되면 다시 시도해요')}
      },700);
    };
    window.cloudPush=push;
    window.cloudLogout=async()=>{await A.signOut(auth);dg.reset();setSync('')};

    A.onAuthStateChanged(auth,user=>{
      window.cloudReady=true;
      if(unsub){unsub();unsub=null}
      if(!user){
        ref=null;window.cloudUser='';
        q('#auth').classList.remove('hide');q('#authLoading').style.display='none';q('#authForm').style.display='block';
        return;
      }
      window.cloudUser=user.email;hideAuth();
      ref=F.doc(db,'users',user.uid);
      setSync('동기화 중…');
      unsub=F.onSnapshot(ref,snap=>{
        if(snap.metadata.hasPendingWrites)return;
        const local=dg.get();
        if(!snap.exists()){push();return}
        const remote=snap.data();
        if((remote.updatedAt||0)>(local.updatedAt||0)){try{dg.set(JSON.parse(remote.data))}catch(e){}}
        else if((local.updatedAt||0)>(remote.updatedAt||0)){push();return}
        setSync(`동기화됨 · ${nowT()}`);
      },err=>setSync('동기화 오류: '+err.code));
    });

    const MSG={
      'auth/invalid-credential':'이메일 또는 비밀번호가 맞지 않아요.',
      'auth/wrong-password':'이메일 또는 비밀번호가 맞지 않아요.',
      'auth/user-not-found':'가입되지 않은 이메일이에요.',
      'auth/email-already-in-use':'이미 가입된 이메일이에요. 로그인해주세요.',
      'auth/weak-password':'비밀번호는 6자 이상이어야 해요.',
      'auth/invalid-email':'이메일 형식을 확인해주세요.',
      'auth/missing-password':'비밀번호를 입력해주세요.',
      'auth/too-many-requests':'시도가 너무 많아요. 잠시 후 다시 해주세요.',
      'auth/network-request-failed':'인터넷 연결을 확인해주세요.'
    };
    const err=t=>{q('#authErr').textContent=t};
    const busy=b=>['#btnLogin','#btnSignup'].forEach(s=>q(s).disabled=b);
    const run=async fn=>{
      const e=q('#aEmail').value.trim(),p=q('#aPw').value;
      if(!e||!p)return err('이메일과 비밀번호를 입력해주세요.');
      err('');busy(true);
      try{await fn(auth,e,p)}catch(x){err(MSG[x.code]||`문제가 생겼어요 (${x.code})`)}
      finally{busy(false)}
    };
    q('#btnLogin').onclick=()=>run(A.signInWithEmailAndPassword);
    q('#btnSignup').onclick=()=>run(A.createUserWithEmailAndPassword);
    q('#aPw').addEventListener('keydown',e=>{if(e.key==='Enter')q('#btnLogin').click()});
    q('#btnReset').onclick=async()=>{
      const e=q('#aEmail').value.trim();
      if(!e)return err('위에 이메일을 먼저 입력해주세요.');
      try{await A.sendPasswordResetEmail(auth,e);err('재설정 메일을 보냈어요. 메일함(스팸함 포함)을 확인해주세요.')}
      catch(x){err(MSG[x.code]||`문제가 생겼어요 (${x.code})`)}
    };
  }catch(e){
    window.cloudReady=true;hideAuth();
  }
}
</script>
</body>
</html>
